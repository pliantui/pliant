name: Code check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    name: pnpm lint
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm exec manypkg check

  format:
    runs-on: ubuntu-latest
    name: pnpm format:check
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm format:check

  typecheck:
    runs-on: ubuntu-latest
    name: pnpm typecheck
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  knip:
    runs-on: ubuntu-latest
    name: pnpm knip
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm knip

  build:
    runs-on: ubuntu-latest
    name: pnpm build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build

  packages:
    runs-on: ubuntu-latest
    name: pnpm check:packages
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm check:packages

  worker:
    runs-on: ubuntu-latest
    name: worker
    timeout-minutes: 15
    env:
      # Cloudflare Workers allow 64 MiB uncompressed, the only limit on the
      # worker bundle. The budget sits far below it, so growth gets noticed.
      # The dry run and the smoke test need no Cloudflare account.
      WORKER_BUDGET_KIB: "10240"
      WRANGLER_SEND_METRICS: "false"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build:packages
      - run: pnpm exec opennextjs-cloudflare build
        working-directory: apps/www
      - run: pnpm exec opennextjs-cloudflare populateCache local
        working-directory: apps/www
      - name: Check the upload size
        working-directory: apps/www
        run: |
          pnpm exec wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker" | tee "$RUNNER_TEMP/dry-run.log"
          total=$(sed -n 's/^Total Upload: \([0-9.]*\) KiB.*/\1/p' "$RUNNER_TEMP/dry-run.log")
          if [ -z "$total" ]; then
            echo "::error::wrangler printed no upload size"
            exit 1
          fi
          echo "Upload: $total KiB of a $WORKER_BUDGET_KIB KiB budget"
          if awk -v total="$total" -v budget="$WORKER_BUDGET_KIB" 'BEGIN { exit !(total > budget) }'; then
            echo "::error::The worker upload is $total KiB, over the $WORKER_BUDGET_KIB KiB budget"
            exit 1
          fi
      # Serves the built worker locally in workerd and requests a few routes.
      - name: Smoke-test the worker
        working-directory: apps/www
        run: |
          setsid pnpm exec wrangler dev --port 8787 > "$RUNNER_TEMP/wrangler-dev.log" 2>&1 &
          server=$!
          trap 'kill -- "-$server" 2>/dev/null || true' EXIT
          for _ in $(seq 60); do
            curl -fs -o /dev/null http://localhost:8787/ && break
            sleep 2
          done
          for path in / /docs /api/search; do
            curl -fsS -o /dev/null "http://localhost:8787$path" || {
              cat "$RUNNER_TEMP/wrangler-dev.log"
              exit 1
            }
          done

  actionlint:
    runs-on: ubuntu-latest
    name: actionlint
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
      - run: '"$RUNNER_TEMP/actionlint" -color'
