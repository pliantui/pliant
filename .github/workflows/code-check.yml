name: Code check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    name: pnpm lint
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm exec manypkg check

  format:
    runs-on: ubuntu-latest
    name: pnpm format:check
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm format:check

  typecheck:
    runs-on: ubuntu-latest
    name: pnpm typecheck
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  knip:
    runs-on: ubuntu-latest
    name: pnpm knip
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm knip

  build:
    runs-on: ubuntu-latest
    name: pnpm build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build

  scan:
    runs-on: ubuntu-latest
    name: pliantui scan --check
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm exec turbo run build --filter=pliantui
      - run: node packages/pliantui/dist/index.js scan --check --cwd apps/www

  packages:
    runs-on: ubuntu-latest
    name: pnpm check:packages
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm check:packages

  worker:
    runs-on: ubuntu-latest
    name: worker
    timeout-minutes: 15
    env:
      # Cloudflare Workers allow 64 MiB uncompressed, the only limit on the
      # worker bundle. The budget sits far below it, so growth gets noticed.
      # Prefer serving pages and files as static assets over growing it.
      # The dry run and the smoke test need no Cloudflare account.
      WORKER_BUDGET_KIB: "16384"
      WRANGLER_SEND_METRICS: "false"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The build command a deployment runs, as documented in CONTRIBUTING.
      - name: Build the worker
        working-directory: apps/www
        run: pnpm -w exec turbo run build --filter=www^... && pnpm exec opennextjs-cloudflare build && pnpm exec opennextjs-cloudflare populateCache local
      - name: Check the upload size
        working-directory: apps/www
        run: |
          pnpm exec wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker" | tee "$RUNNER_TEMP/dry-run.log"
          total=$(sed -n 's/^Total Upload: \([0-9.]*\) KiB.*/\1/p' "$RUNNER_TEMP/dry-run.log")
          if [ -z "$total" ]; then
            echo "::error::wrangler printed no upload size"
            exit 1
          fi
          echo "Upload: $total KiB of a $WORKER_BUDGET_KIB KiB budget"
          if awk -v total="$total" -v budget="$WORKER_BUDGET_KIB" 'BEGIN { exit !(total > budget) }'; then
            echo "::error::The worker upload is $total KiB, over the $WORKER_BUDGET_KIB KiB budget"
            exit 1
          fi
      # Serves the built worker locally in workerd, requests a few routes and
      # replays a recorded ask.
      - name: Smoke-test the worker
        working-directory: apps/www
        run: |
          setsid pnpm exec wrangler dev --port 8787 --var PLIANT_ASK_ENABLED:1 > "$RUNNER_TEMP/wrangler-dev.log" 2>&1 &
          server=$!
          trap 'kill -- "-$server" 2>/dev/null || true; cat "$RUNNER_TEMP/wrangler-dev.log"' EXIT
          for _ in $(seq 60); do
            curl -fs --max-time 30 -o /dev/null http://localhost:8787/ && break
            sleep 2
          done
          for path in / /docs /api/search; do
            curl -fsS --max-time 30 -o /dev/null "http://localhost:8787$path"
          done
          curl -fsS --max-time 30 -D - -o /dev/null http://localhost:8787/schema/overlay.json |
            grep -qi '^access-control-allow-origin: \*'
          node -e '
            const demo = require("./scripts/demo-asks.json")
            const { target, context } = demo.targets.find((t) => t.target === "key-metrics")
            const prompt = "put the overdue card first"
            process.stdout.write(JSON.stringify({ surface: demo.surface, target, prompt, context }))
          ' > "$RUNNER_TEMP/ask.json"
          curl -fsS --max-time 30 -H "content-type: application/json" --data "@$RUNNER_TEMP/ask.json" http://localhost:8787/api/pliant |
            jq -e '.status == "ok" and .explain == ["Moved the Overdue card to the first position."]'

  actionlint:
    runs-on: ubuntu-latest
    name: actionlint
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
      - run: '"$RUNNER_TEMP/actionlint" -color'
