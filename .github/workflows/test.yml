name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    name: pnpm test (Node.js ${{ matrix.node }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 22.12.0 is the lowest Node.js version the CLI and server support.
        node: ["22.12.0", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build:packages
      # The build tools need a newer Node.js than the packages do, so build
      # first, then run the tests on the version under test.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: pnpm --recursive --filter=./packages/* --filter=www test

  zod:
    runs-on: ubuntu-latest
    name: pnpm test (zod 4.0.16)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Build with the development Zod version first, so the type check below
      # checks the declarations that ship against the lowest supported one.
      - run: pnpm build:packages
      - run: >-
          pnpm --filter @pliantui/contract --filter @pliantui/core
          --filter @pliantui/react add --save-dev zod@4.0.16
      # The published JSON Schemas are generated with the development Zod
      # version, so only the check that regenerates them is skipped.
      - run: >-
          pnpm --filter @pliantui/contract exec vitest run
          --testNamePattern '^(?!.*matches the published file)'
      - run: pnpm --filter @pliantui/core --filter @pliantui/react test
      - run: >-
          pnpm --recursive --filter @pliantui/contract --filter @pliantui/core
          --filter @pliantui/react exec tsc --ignoreConfig --noEmit --strict --skipLibCheck false
          --module preserve --moduleResolution bundler dist/index.d.ts
      - run: >-
          pnpm --filter @pliantui/react
          exec tsc --ignoreConfig --noEmit --strict --skipLibCheck false
          --module preserve --moduleResolution bundler dist/table.d.ts

  zod-server:
    runs-on: ubuntu-latest
    name: pnpm test (server, zod 4.1.8)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The server's floor is higher than contract's and core's, because the
      # AI SDK needs Zod 4.1.8.
      - run: pnpm build:packages
      # Every package gets 4.1.8, as in an app at the server's floor.
      - run: >-
          pnpm --filter @pliantui/contract --filter @pliantui/core
          --filter @pliantui/server add --save-dev zod@4.1.8
      - run: pnpm --filter www add zod@4.1.8
      - run: pnpm --filter @pliantui/server test
      - run: pnpm --filter www exec vitest run app/api/pliant/recordings.test.ts
      # `ai`'s own declarations reference Node.js types, hence --types node.
      - run: >-
          pnpm --filter @pliantui/server
          exec tsc --ignoreConfig --noEmit --strict --skipLibCheck false
          --types node --module preserve --moduleResolution bundler
          dist/index.d.ts dist/recordings.d.ts

  react:
    runs-on: ubuntu-latest
    name: pnpm test (react 19.2.0)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build:packages
      # 19.2.0 is the lowest React version @pliantui/react supports. The type
      # packages are pinned too, so the declarations check against its types.
      - run: >-
          pnpm --filter @pliantui/react --filter www add
          react@19.2.0 react-dom@19.2.0 @types/react@19.2.0 @types/react-dom@19.2.0
      - run: |
          for pkg in @pliantui/react www; do
            for dep in react react-dom @types/react @types/react-dom; do
              pnpm --filter "$pkg" exec node -e '
                const [dep, want] = process.argv.slice(1)
                const { version } = JSON.parse(
                  require("node:fs").readFileSync("node_modules/" + dep + "/package.json", "utf8")
                )
                if (version !== want) throw new Error(dep + " is " + version + ", not " + want)
              ' "$dep" 19.2.0
            done
          done
      # The package's own sources aren't type-checked here: one test uses
      # ViewTransition, which React 19.2's types don't declare.
      - run: >-
          pnpm --filter @pliantui/react
          exec tsc --ignoreConfig --noEmit --strict --skipLibCheck false
          --module preserve --moduleResolution bundler dist/index.d.ts dist/table.d.ts
      - run: pnpm --filter @pliantui/react test
      - run: pnpm --filter www exec vitest run

  next:
    runs-on: ubuntu-latest
    name: pnpm build (next 16.0.0)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build:packages
      # 16.0.0 is the first Next.js 16 release.
      - run: pnpm --filter tests add next@16.0.0
      - run: |
          for pkg in tests; do
            for dep in next; do
              pnpm --filter "$pkg" exec node -e '
                const [dep, want] = process.argv.slice(1)
                const { version } = JSON.parse(
                  require("node:fs").readFileSync("node_modules/" + dep + "/package.json", "utf8")
                )
                if (version !== want) throw new Error(dep + " is " + version + ", not " + want)
              ' "$dep" 16.0.0
            done
          done
      # Builds a minimal app that uses the packages, as an app of ours would.
      - run: pnpm --filter tests build:fixture

  table:
    runs-on: ubuntu-latest
    name: pnpm test (tanstack table 9.3.1)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build:packages
      # 9.3.1 is the lowest TanStack Table version @pliantui/react supports.
      - run: >-
          pnpm --filter @pliantui/react --filter www add
          @tanstack/react-table@9.3.1
      - run: |
          for pkg in @pliantui/react www; do
            for dep in @tanstack/react-table; do
              pnpm --filter "$pkg" exec node -e '
                const [dep, want] = process.argv.slice(1)
                const { version } = JSON.parse(
                  require("node:fs").readFileSync("node_modules/" + dep + "/package.json", "utf8")
                )
                if (version !== want) throw new Error(dep + " is " + version + ", not " + want)
              ' "$dep" 9.3.1
            done
          done
      - run: pnpm --filter @pliantui/react typecheck
      - run: >-
          pnpm --filter @pliantui/react
          exec tsc --ignoreConfig --noEmit --strict --skipLibCheck false
          --module preserve --moduleResolution bundler dist/table.d.ts
      - run: pnpm --filter @pliantui/react test
      - run: pnpm --filter www exec vitest run

  ai:
    runs-on: ubuntu-latest
    name: pnpm test (server, ai 7.0.0)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build:packages
      # 7.0.0 is the lowest version @pliantui/server supports.
      - run: pnpm --filter @pliantui/server add ai@7.0.0
      - run: |
          for pkg in @pliantui/server; do
            for dep in ai; do
              pnpm --filter "$pkg" exec node -e '
                const [dep, want] = process.argv.slice(1)
                const { version } = JSON.parse(
                  require("node:fs").readFileSync("node_modules/" + dep + "/package.json", "utf8")
                )
                if (version !== want) throw new Error(dep + " is " + version + ", not " + want)
              ' "$dep" 7.0.0
            done
          done
      - run: pnpm --filter @pliantui/server typecheck
      - run: pnpm --filter @pliantui/server test
      # `ai`'s own declarations reference Node.js types, hence --types node.
      - run: >-
          pnpm --filter @pliantui/server
          exec tsc --ignoreConfig --noEmit --strict --skipLibCheck false
          --types node --module preserve --moduleResolution bundler
          dist/index.d.ts dist/recordings.d.ts
