name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    name: pnpm test (Node.js ${{ matrix.node }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 22.12.0 is the lowest Node.js version the CLI and server support.
        node: ["22.12.0", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build:packages
      # The build tools need a newer Node.js than the packages do, so build
      # first, then run the tests on the version under test.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: pnpm --recursive --filter=./packages/* test

  zod:
    runs-on: ubuntu-latest
    name: pnpm test (zod 4.0.0)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm --filter @pliantui/contract add --save-dev zod@4.0.0
      # Union error messages differ between Zod minors, so only accept and
      # reject behaviour is checked against the lowest supported version.
      - run: >-
          pnpm --filter @pliantui/contract exec vitest run
          --testNamePattern '^(?!.*(matches the published file|reports ))'
