name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    name: pnpm test (Node.js ${{ matrix.node }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 22.12.0 is the lowest Node.js version the CLI and server support.
        node: ["22.12.0", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build:packages
      # The build tools need a newer Node.js than the packages do, so build
      # first, then run the tests on the version under test.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: pnpm --recursive --filter=./packages/* test

  zod:
    runs-on: ubuntu-latest
    name: pnpm test (zod 4.0.16)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Build with the development Zod version first, so the type check below
      # checks the declarations that ship against the lowest supported one.
      - run: pnpm build:packages
      - run: >-
          pnpm --filter @pliantui/contract --filter @pliantui/core
          add --save-dev zod@4.0.16
      # The published JSON Schemas are generated with the development Zod
      # version, so only the check that regenerates them is skipped.
      - run: >-
          pnpm --filter @pliantui/contract exec vitest run
          --testNamePattern '^(?!.*matches the published file)'
      - run: pnpm --filter @pliantui/core test
      - run: >-
          pnpm --recursive --filter @pliantui/contract --filter @pliantui/core
          exec tsc --ignoreConfig --noEmit --strict --skipLibCheck false
          --module preserve --moduleResolution bundler dist/index.d.ts
